<script>
    function toggleLoanForm() {

        // Hide all loan forms

        const loanForms = ['homeLoan', 'propertyLoan', 'CarLoan', 'BussinessLoan', 'personalLoan'];



        loanForms.forEach(function(form) {

            document.getElementById(form).style.display = 'none';

        });

        document.getElementById("homeSalaried").style.display = "none";

        document.getElementById("homeSelfEmployed").style.display = "none";

        document.getElementById("propertySalaried").style.display = "none";

        document.getElementById("propertySelfEmployed").style.display = "none";

        document.getElementById("carSalaried").style.display = "none";

        document.getElementById("carSelfEmployed").style.display = "none";

        // Get the selected loan type

        var loanType = document.querySelector('input[name="loan_type"]:checked').value;

        // console.log(loanType);

        // Show the selected loan form

        if (loanType === "home") {

            document.getElementById("homeLoan").style.display = "block";

        } else if (loanType === "property") {

            document.getElementById("propertyLoan").style.display = "block";

        } else if (loanType === "car") {

            document.getElementById("CarLoan").style.display = "block";

        } else if (loanType === "bussiness") {

            document.getElementById("BussinessLoan").style.display = "block";

        } else if (loanType === "personal") {

            document.getElementById("personalLoan").style.display = "block";

        }

    }



    function toggleHomeLoanDetails() {

        // Hide all home loan options

        document.getElementById("homeSalaried").style.display = "none";

        document.getElementById("homeSelfEmployed").style.display = "none";

        document.getElementById("propertySalaried").style.display = "none";

        document.getElementById("propertySelfEmployed").style.display = "none";

        document.getElementById("carSalaried").style.display = "none";

        document.getElementById("carSelfEmployed").style.display = "none";

        // Show selected home loan option

        var selectedLoan = document.getElementById("homeLoanTypeSelect").value;

        if (selectedLoan === "homeSalaried") {

            document.getElementById("homeSalaried").style.display = "block";

        } else if (selectedLoan == "homeSelfEmployed") {

            document.getElementById("homeSelfEmployed").style.display = "block";

        }

    }



    function togglePropertyLoanDetails() {

        // Hide all property loan options

        document.getElementById("propertySalaried").style.display = "none";

        document.getElementById("propertySelfEmployed").style.display = "none";

        document.getElementById("homeSalaried").style.display = "none";

        document.getElementById("homeSelfEmployed").style.display = "none";

        document.getElementById("carSalaried").style.display = "none";

        document.getElementById("carSelfEmployed").style.display = "none";

        // Show selected property loan option

        var selectedLoan = document.getElementById("propertyLoanTypeSelect").value;

        if (selectedLoan == "propertySalaried") {

            document.getElementById("propertySalaried").style.display = "block";

        } else if (selectedLoan == "propertySelfEmployed") {

            document.getElementById("propertySelfEmployed").style.display = "block";

        }

    }



    function toggleCarLoanDetails() {

        // Hide all car loan options

        document.getElementById("carSalaried").style.display = "none";

        document.getElementById("carSelfEmployed").style.display = "none";

        document.getElementById("homeSalaried").style.display = "none";

        document.getElementById("homeSelfEmployed").style.display = "none";

        document.getElementById("propertySalaried").style.display = "none";

        document.getElementById("propertySelfEmployed").style.display = "none";

        // Show selected car loan option

        var selectedLoan = document.getElementById("carLoanTypeSelect").value;

        if (selectedLoan === "carSalaried") {

            document.getElementById("carSalaried").style.display = "block";

        } else if (selectedLoan === "carSelfEmployed") {

            document.getElementById("carSelfEmployed").style.display = "block";

        }

    }
</script>

<script>

    
    function getTokenFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        console.log('ddd',urlParams);
        return urlParams.get('token'); 
    }

    document.getElementById('applications').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this); 

        const apiKey = getTokenFromUrl();
        if (apiKey) {
            formData.append('api_key', apiKey); 
        }

        fetch('https://aadsfinancial.com/api/v1/loan-data', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 200) {
                    alert('Form submitted successfully!');
                    console.log('Response:', data);
                } else {
                    alert('Error submitting form');
                    console.error('Error:', data.message);
                }
            })
            .catch(error => {
                console.error('Request failed', error);
                alert('Failed to submit form');
            });
    });
</script>
